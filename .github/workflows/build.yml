name: Build

on:
  push:
    # Branches only: a tag push is for the release workflow.
    branches: ["**"]
  pull_request:
  # Pushes to the fork build nothing, as its workflows stay disabled, so its branch tip is built
  # here: every Monday, and by hand with any branch, tag or commit of the fork
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      firmware_ref:
        description: "A branch, tag or commit of the fork to build; empty builds the recorded commit"
        required: false
        default: screen-reader

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FBT_GIT_SUBMODULE_SHALLOW: "1"
      WORKFLOW_BRANCH_OR_TAG: screen-reader
    steps:
      - name: Check out the project
        uses: actions/checkout@v7

      - name: Check out the firmware submodule
        run: git submodule update --init --depth 1 Momentum-Firmware

      # A scheduled run builds the fork's screen-reader tip, a run by hand the ref it was given,
      # in place of the commit this project records
      - name: Check out the fork's branch tip
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.firmware_ref != '')
        env:
          REF: ${{ github.event_name == 'schedule' && 'screen-reader' || inputs.firmware_ref }}
        run: |
          git -C Momentum-Firmware fetch --depth 1 --no-tags origin "$REF"
          git -C Momentum-Firmware checkout -q --detach FETCH_HEAD
          echo "::notice::The fork's $REF, commit $(git -C Momentum-Firmware rev-parse --short=9 HEAD)"

      # The host tests unpack the voice pack with the firmware's tar reader; fbt checks out the
      # firmware's other submodules itself, after the tests
      - name: Check out the firmware's tar reader
        run: git -C Momentum-Firmware submodule update --init --depth 1 lib/microtar

      # The golden checks compare the fork's API table and Sub-GHz manifest with Momentum's at the
      # commit the fork builds on, pinned in tools/momentum-base.txt, which the shallow checkout
      # lacks
      - name: Fetch the Momentum commit the fork builds on
        run: git -C Momentum-Firmware fetch --depth 1 --no-tags origin "$(cat tools/momentum-base.txt)"

      - name: Name the build after the firmware commit
        run: echo "DIST_SUFFIX=sonar-ci-$(git -C Momentum-Firmware rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Cache the toolchain
        uses: actions/cache@v6
        with:
          path: Momentum-Firmware/toolchain
          key: toolchain-${{ hashFiles('Momentum-Firmware/scripts/toolchain/fbtenv.sh') }}

      # Python 3.10, the oldest the tools support, with the packages of requirements.txt, so that
      # every Python check runs; --no-skips fails the tests if one does not
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install the tools' Python packages
        run: pip install -r requirements.txt

      - name: Host tests
        run: tools/run_host_tests.sh --no-skips

      # What Momentum's own lint workflow checks: the C formatting, the build scripts' Python and
      # the images
      - name: Lint the firmware
        run: cd Momentum-Firmware && ./fbt lint_all

      - name: Build the firmware and its update package
        run: cd Momentum-Firmware && ./fbt COMPACT=1 DEBUG=0 updater_package

      # fbt rewrites targets/f7/api_symbols.csv when the firmware's API has drifted from it, and
      # the build still passes, so a drift shows here
      - name: Check that the build changed no tracked file
        run: |
          git -C Momentum-Firmware diff --exit-code
          git diff --exit-code --ignore-submodules

      - name: Flash headroom
        run: tools/flash_headroom.sh

      - name: Upload the package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST_SUFFIX }}
          path: Momentum-Firmware/dist/f7-C/flipper-z-f7-update-*.tgz
          if-no-files-found: error
